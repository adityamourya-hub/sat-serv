linters-settings:
  govet:
    check-shadowing: true
  revive:
    rules:
      - name: exported
      - name: blank-imports
      - name: context-as-first-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
  gosec:
    excludes:
      - G104 # We handle some errors with explicit logging
  staticcheck:
    checks: ["all"]

linters:
  enable:
    - govet
    - revive
    - gosec
    - staticcheck
    - errcheck
    - bodyclose
    - ineffassign
    - typecheck

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
