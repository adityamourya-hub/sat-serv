version: '3.8'

services:
  # The Data Lake: PostgreSQL + TimescaleDB + PostGIS
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: ssis_datalake
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=ssis_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d # Auto-runs your schema (including 02_alerts.sql)
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aditya_admin -d ssis_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The Zero-Copy Hub: Apache Arrow Plasma Store
  plasma:
    image: apache/arrow-dev:latest-python-3.11
    container_name: plasma_bridge
    command: plasma_store -m 2000000000 -s /tmp/plasma # 2GB SHM Store
    volumes:
      - shared_mem:/tmp
    shm_size: '2gb' # Direct allocation of shared memory

  # SSIS Sovereign Engine with Alerting System
  engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: ssis_engine
    restart: always
    ports:
      - "50051:50051" # gRPC
      - "8080:8080"   # REST API + SSE
    volumes:
      - ./configs:/app/configs:ro # Mount alert rules config (read-only)
      - ./pkg/ml/models:/app/pkg/ml/models:ro # ONNX models
    environment:
      - SSIS_DB_URL=postgres://aditya_admin:changeme@db:5432/ssis_db?sslmode=disable
      - SSIS_CONFIG_PATH=/app/configs
      - SSIS_MODEL_DIR=/app/pkg/ml/models
      - SSIS_GRPC_PORT=50051
      - SSIS_REST_PORT=8080
      - LD_LIBRARY_PATH=/usr/local/lib
    depends_on:
      db:
        condition: service_healthy
      plasma:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics Template (Python/MPDAF/JAX)
  analytics:
    image: python:3.11-slim
    container_name: ssis_analytics
    volumes:
      - ./analytics:/app
      - shared_mem:/tmp
    environment:
      - PLASMA_PATH=/tmp/plasma
      - JAX_PLATFORMS=cpu # Switch to 'metal' locally on Mac host
    depends_on:
      - db
      - plasma
    command: tail -f /dev/null # Keeps it alive for dev

volumes:
  postgres_data:
  shared_mem:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
