[project]
name = "quantum-immune-digital-twin"
version = "0.1.0"
description = "Active QP Evasion for Rad-Hard Majorana-Photonic Compute Substrate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "qutip>=5.0.0",
    "numba>=0.59.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "dash>=2.17.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

# 2026 Performance Stack (JAX/Diffrax-based)
jax2026 = [
    "jax>=0.4.28",
    "jaxlib>=0.4.28",
    "diffrax>=0.5.1",
    "lineax>=0.0.5",
    "dynamiqs>=0.2.0",
    "equinox>=0.11.4",
    "optimistix>=0.0.7",
]

# GPU acceleration
jax-cuda = [
    "jax[cuda12]>=0.4.28",
    "jaxlib>=0.4.28",
    "numba-cuda>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
