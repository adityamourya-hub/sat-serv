[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idex"
version = "0.1.0"
description = "Space Domain Awareness research substrate — Go operational code + Python/JAX ML experiments"
readme = "ssis/README.md"
requires-python = ">=3.10"

# Consolidated from 9 scattered requirements.txt files.
# NOTE: Several packages listed below are hallucinated (no PyPI release exists):
#   mpdaf, ginga, pysynphot, pyindi-client, alpyca — see forensic report.
dependencies = [
    # Core ML
    "numpy>=1.26",
    "torch>=2.3",
    "torchvision",
    "torchaudio",
    "jax[cpu]>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.7.0",
    "optax>=0.1.7",
    "onnx>=1.16",
    # SciPy stack
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "h5py>=3.10.0",
    # Astronomy / physics
    "astropy>=6.0.0",
    "photutils>=1.9.0",
    # ML libraries
    "scikit-learn>=1.5",
    "scikit-image>=0.21.0",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "transformers>=4.40",
    "datasets>=2.19",
    "peft>=0.11",
    "trl>=0.8",
    "bitsandbytes>=0.43",
    "accelerate>=0.30",
    # RL
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    # Visualization / logging
    "matplotlib>=3.8.0",
    "tensorboard>=2.15.0",
    "wandb>=0.16.0",
    "tqdm>=4.66.0",
    # Data / messaging
    "pyarrow>=14.0.0",
    "pyzmq>=25.1.0",
    "msgpack>=1.0.7",
    "pillow>=10.0.0",
    # Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # Forecasting
    "prophet>=1.1",
    # ONNX tooling
    "skl2onnx>=1.17",
    # Hallucinated deps — kept as comments since they have no PyPI release
    # "mpdaf>=3.5.0",
    # "ginga>=4.0.0",
    # "pysynphot>=1.3.0",
    # "pyindi-client>=0.2.4",
    # "alpyca>=2.0.0",
    # "redis>=5.0.0",
    # "psycopg2-binary>=2.9.0",
    # "pydmd>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["ai", "sda-train"]
