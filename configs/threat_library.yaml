# Sovereign Threat Library for ADITI 4.0
# Air-gapped intelligence database for HGV identification
# Location: configs/threat_library.yaml

threats:
  # Hypersonic Glide Vehicles (HGV)
  - id: "HGV_TYPE_A_REGIONAL"
    common_name: "DF-ZF"
    country_code: "CHN"
    aerodynamics:
      ld_ratio_min: 1.8
      ld_ratio_max: 2.2
      cd_range: [0.35, 0.45]
      cl_range: [0.70, 0.90]
      max_mach: 10.0
      glide_altitude_min: 30.0  # km
      glide_altitude_max: 60.0  # km
    tactical_profile: "High-lift, skip-glide maneuverability. High-G pull-up capability."
    intent_label: "MARS_HYPERSONIC"
    threat_level: 9  # 1-10 scale
    countermeasure_policy: "kinetic_interceptor_midcourse"
    notes: "Chinese DF-ZF. L/D ~2.0 enables extended range skip-glide. Suspected tested 2023."

  - id: "HGV_TYPE_B_EXPERIMENTAL"
    common_name: "Starry Sky-2"
    country_code: "CHN"
    aerodynamics:
      ld_ratio_min: 3.5
      ld_ratio_max: 4.5
      cd_range: [0.25, 0.35]
      cl_range: [0.90, 1.40]
      max_mach: 6.0
      glide_altitude_min: 25.0  # km
      glide_altitude_max: 50.0  # km
    tactical_profile: "Wave-rider, sustained cruise. Lower G-forces, longer duration."
    intent_label: "MARS_CRUISE"
    threat_level: 8
    countermeasure_policy: "directed_energy_defense"
    notes: "Chinese Starry Sky-2. Wave-rider design. L/D ~4.0 suggests high efficiency."

  - id: "HGV_TYPE_C_RUSSIAN"
    common_name: "Avangard"
    country_code: "RUS"
    aerodynamics:
      ld_ratio_min: 1.5
      ld_ratio_max: 2.0
      cd_range: [0.40, 0.50]
      cl_range: [0.60, 0.90]
      max_mach: 27.0  # ICBM-boosted
      glide_altitude_min: 40.0  # km
      glide_altitude_max: 80.0  # km
    tactical_profile: "ICBM-boosted, fractional orbital. Extreme velocity entry."
    intent_label: "MARS_FRACTIONAL_ORBITAL"
    threat_level: 10  # Maximum
    countermeasure_policy: "boost_phase_intercept"
    notes: "Russian Avangard. FOBS capability. High velocity compensates for lower L/D."

  - id: "HGV_TYPE_D_TACTICAL"
    common_name: "Tactical HGV"
    country_code: "UNK"
    aerodynamics:
      ld_ratio_min: 1.2
      ld_ratio_max: 1.8
      cd_range: [0.45, 0.60]
      cl_range: [0.55, 0.90]
      max_mach: 8.0
      glide_altitude_min: 20.0  # km
      glide_altitude_max: 40.0  # km
    tactical_profile: "Short-range, high-agility. Theater-level threat."
    intent_label: "MARS_TACTICAL"
    threat_level: 7
    countermeasure_policy: "terminal_defense_layered"
    notes: "Generic tactical HGV. Lower L/D suggests limited range but high maneuverability."

  - id: "HGV_TYPE_E_NEXTGEN"
    common_name: "HGV-2026"
    country_code: "UNK"
    aerodynamics:
      ld_ratio_min: 4.0
      ld_ratio_max: 5.0
      cd_range: [0.20, 0.30]
      cl_range: [0.80, 1.50]
      max_mach: 12.0
      glide_altitude_min: 35.0  # km
      glide_altitude_max: 70.0  # km
    tactical_profile: "Next-generation, extreme L/D. Unknown origin."
    intent_label: "MARS_NEXTGEN"
    threat_level: 10
    countermeasure_policy: "multi_layer_defense_unknown"
    notes: "Hypothetical 2026 HGV. L/D >4.0 unprecedented. Requires immediate analysis."

  # Traditional Ballistic Missiles (for comparison)
  - id: "BM_TYPE_A_SRB"
    common_name: "Short-Range Ballistic"
    country_code: "UNK"
    aerodynamics:
      ld_ratio_min: 0.1
      ld_ratio_max: 0.5
      cd_range: [0.40, 0.60]
      cl_range: [0.05, 0.20]
      max_mach: 5.0
      glide_altitude_min: 0.0  # km
      glide_altitude_max: 100.0  # km (ballistic arc)
    tactical_profile: "Non-maneuverable ballistic trajectory. Predictable."
    intent_label: "MARS_BALLISTIC"
    threat_level: 5
    countermeasure_policy: "standard_patriot_intercept"
    notes: "Traditional ballistic missile. No lift capability. High drag during re-entry."

# Default configuration
configuration:
  auto_update_uct: true  # Automatically add new UCT discoveries
  uct_certainty_threshold: 0.75  # Min confidence to add to library
  max_library_size: 1000  # Prevent unbounded growth
  validation_required: true  # Human review for new entries
  
