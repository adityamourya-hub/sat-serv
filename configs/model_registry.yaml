# Model Registry for  Neural Network Stack
# Central manifest of all ML models, their ONNX exports, and Go inference wrappers
#
# Schema:
#   name: Unique model identifier
#   version: Model version (semantic versioning)
#   onnx_path: Relative path to ONNX file (from project root)
#   opset: ONNX opset version
#   input_schema: Input tensor specifications (name, shape, dtype)
#   output_schema: Output tensor specifications (name, shape, dtype)
#   quantization: Quantization level (fp32, fp16, int8)
#   tier: PAX execution tier (0=Go-native, 1=INT8-ONNX, 2=FP32-DPHNO, 3=JAX-Discovery)
#   description: Brief description of model purpose
#   go_wrapper: Generated Go struct name for inference

models:
  # DPHNO (Dissipative Port-Hamiltonian Neural Operator)
  - name: dphno_hamiltonian
    version: "1.0.0"
    onnx_path: ai/v3/axiom_se3_ghnn.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float32
      - name: latent_code
        shape: [1, 128]
        dtype: float32
    output_schema:
      - name: dynamics
        shape: [1, 6]
        dtype: float32
      - name: hamiltonian
        shape: [1]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Port-Hamiltonian neural operator for orbital dynamics with energy conservation
    go_wrapper: DPHNOHamiltonianModel

  - name: dphno_hamiltonian_fp16
    version: "1.0.0"
    onnx_path: ai/v3/axiom_se3_ghnn_fp16.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float16
      - name: latent_code
        shape: [1, 128]
        dtype: float16
    output_schema:
      - name: dynamics
        shape: [1, 6]
        dtype: float16
      - name: hamiltonian
        shape: [1]
        dtype: float16
    quantization: fp16
    tier: 1
    description: FP16 quantized DPHNO for thermal throttling (Tier1)
    go_wrapper: DPHNOHamiltonianFP16Model

  # Maneuver Detection — TRAINED (P3, LSTM, 87.4% val acc)
  - name: maneuver_detector
    version: "2.1.0"
    onnx_path: pkg/ml/models/maneuver_detector.onnx
    opset: 16
    input_schema:
      - name: maneuver_window
        shape: [1, -1, 2]
        dtype: float32
    output_schema:
      - name: maneuver_probability
        shape: [1, 1]
        dtype: float32
      - name: maneuver_type_logits
        shape: [1, 2]
        dtype: float32
      - name: delta_v_estimate
        shape: [1, 1]
        dtype: float32
      - name: confidence_score
        shape: [1, 1]
        dtype: float32
    quantization: fp32
    tier: 1
    description: PINN-accelerated learned residual analysis for delta-V discovery (maneuver detection)
    go_wrapper: ManeuverDetectorModel

  # Collision Risk — TRAINED (P3, GNN surrogate, 25 epochs, loss 0.305)
  - name: collision_risk
    version: "1.5.0"
    onnx_path: pkg/ml/models/collision_risk.onnx
    opset: 16
    input_schema:
      - name: nodes
        shape: [1, 10, 26]
        dtype: float32
      - name: adj
        shape: [1, 10, 10]
        dtype: float32
      - name: iono
        shape: [1, 16]
        dtype: float32
    output_schema:
      - name: risk_alphas
        shape: [1, 3]
        dtype: float32
      - name: maneuver_logits
        shape: [1, 3]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Collision probability estimation with evidential Dirichlet + maneuver classification
    go_wrapper: CollisionRiskModel


  # ICNN Energy Model
  # WARNING: ONNX file does not exist - model referenced but not trained/exported
  - name: icnn_hamiltonian
    version: "1.2.0"
    onnx_path: ai/v3/icnn_h_net.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float32
      - name: latent_context
        shape: [1, 64]
        dtype: float32
    output_schema:
      - name: hamiltonian
        shape: [1]
        dtype: float32
      - name: gradient
        shape: [1, 6]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Input Convex Neural Network for Hamiltonian energy (guarantees convexity) - MISSING ONNX
    go_wrapper: ICNNHamiltonianModel
    stub_implementation: true

  # NavIC Anomaly Detection — TRAINED (P3, BiLSTM-Attention, 100% val acc)
  - name: navic_anomaly_detector
    version: "1.0.0"
    onnx_path: pkg/ml/models/navic_anomaly_detector.onnx
    opset: 17
    input_schema:
      - name: residual_history
        shape: [1, 60, 12]
        dtype: float32
    output_schema:
      - name: class_logits
        shape: [1, 3]
        dtype: float32
      - name: confidence
        shape: [1, 1]
        dtype: float32
    quantization: fp32
    tier: 1
    description: NavIC spoofing/jamming detection via dual-frequency residual analysis
    go_wrapper: NavICAnomalyDetectorModel

  # Blindspot Forecaster
  # WARNING: ONNX file does not exist - stub implementation only
  - name: blindspot_forecaster
    version: "1.0.0"
    onnx_path: pkg/ml/onnx/blindspot_forecaster.onnx
    opset: 16
    input_schema:
      - name: occlusion_history
        shape: [1, 50, 6]
        dtype: float32
    output_schema:
      - name: predicted_trajectory
        shape: [1, 10, 6]
        dtype: float32
    quantization: fp16
    tier: 2
    description: Predicts object trajectory through sensor blindspots - STUB ONLY
    go_wrapper: BlindspotForecasterModel
    stub_implementation: true

 # ATeena Sensor Tasking — TRAINED (PPO, 50k timesteps, 8 stations × 5 regions)
  - name: sensor_tasking
    version: "1.0.0"
    onnx_path: pkg/ml/models/sensor_tasking.onnx
    opset: 17
    input_schema:
      - name: sensor_state
        shape: [1, -1]
        dtype: float32
    output_schema:
      - name: station_probs
        shape: [1, 8]
        dtype: float32
      - name: continuous_action
        shape: [1, 3]
        dtype: float32
      - name: value
        shape: [1, 1]
        dtype: float32
    quantization: fp32
    tier: 2
    description: PPO-trained sensor tasking policy for volumetric scan + blind spot detection
    go_wrapper: SensorTaskingModel

  # Rapid Ranker — TRAINED (XGBoost distillation + neural evidential, 9 features)
  - name: rapid_ranker
    version: "4.0.0"
    onnx_path: pkg/ml/models/rapid_ranker.onnx
    opset: 17
    input_schema:
      - name: rapid_features
        shape: [1, 9]
        dtype: float32
    output_schema:
      - name: dynamic_score
        shape: [1, 1]
        dtype: float32
      - name: confidence
        shape: [1, 1]
        dtype: float32
      - name: uncertainty_low
        shape: [1, 1]
        dtype: float32
      - name: uncertainty_high
        shape: [1, 1]
        dtype: float32
    quantization: fp32
    tier: 1
    description: Neural threat ranker with XGBoost knowledge distillation (9 features, 4 outputs)
    go_wrapper: RapidRankerModel

  # Axiom-HNODE — TRAINED (Port-Hamiltonian System, 100k trajectories, 100 epochs)
  - name: axiom_hnode
    version: "2.0.0"
    onnx_path: pkg/ml/models/hnode_core.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float32
    output_schema:
      - name: dynamics
        shape: [1, 6]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Port-Hamiltonian Neural ODE for symplectic orbital propagation with energy conservation
    go_wrapper: AxiomHNODEModel

# Global settings
settings:
  default_opset: 17
  default_quantization: fp32
  onnx_validation:
    check_model: true
    check_opset: true
    check_dtype: true
  go_package: ssis/pkg/ml/models
  code_gen_output: pkg/ml/models/generated
