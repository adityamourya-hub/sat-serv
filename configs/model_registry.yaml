# Model Registry for  Neural Network Stack
# Central manifest of all ML models, their ONNX exports, and Go inference wrappers
#
# Schema:
#   name: Unique model identifier
#   version: Model version (semantic versioning)
#   onnx_path: Relative path to ONNX file (from project root)
#   opset: ONNX opset version
#   input_schema: Input tensor specifications (name, shape, dtype)
#   output_schema: Output tensor specifications (name, shape, dtype)
#   quantization: Quantization level (fp32, fp16, int8)
#   tier: PAX execution tier (0=Go-native, 1=INT8-ONNX, 2=FP32-DPHNO, 3=JAX-Discovery)
#   description: Brief description of model purpose
#   go_wrapper: Generated Go struct name for inference

models:
  # DPHNO (Dissipative Port-Hamiltonian Neural Operator)
  - name: dphno_hamiltonian
    version: "1.0.0"
    onnx_path: ai/v3/axiom_se3_ghnn.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float32
      - name: latent_code
        shape: [1, 128]
        dtype: float32
    output_schema:
      - name: dynamics
        shape: [1, 6]
        dtype: float32
      - name: hamiltonian
        shape: [1]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Port-Hamiltonian neural operator for orbital dynamics with energy conservation
    go_wrapper: DPHNOHamiltonianModel

  - name: dphno_hamiltonian_fp16
    version: "1.0.0"
    onnx_path: ai/v3/axiom_se3_ghnn_fp16.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float16
      - name: latent_code
        shape: [1, 128]
        dtype: float16
    output_schema:
      - name: dynamics
        shape: [1, 6]
        dtype: float16
      - name: hamiltonian
        shape: [1]
        dtype: float16
    quantization: fp16
    tier: 1
    description: FP16 quantized DPHNO for thermal throttling (Tier1)
    go_wrapper: DPHNOHamiltonianFP16Model

  # Maneuver Detection
  # WARNING: ONNX file does not exist - stub implementation only
  # Go wrapper returns: fmt.Errorf("onnx runtime inference not yet bound")
  - name: maneuver_detector
    version: "2.1.0"
    onnx_path: pkg/ml/onnx/maneuver_model.onnx
    opset: 16
    input_schema:
      - name: trajectory_window
        shape: [1, 100, 6]
        dtype: float32
      - name: residuals
        shape: [1, 100]
        dtype: float32
    output_schema:
      - name: maneuver_probability
        shape: [1, 4]
        dtype: float32
      - name: delta_v
        shape: [1]
        dtype: float32
    quantization: int8
    tier: 1
    description: HGV maneuver classification (ballistic, glide, impulsive, low-thrust) - STUB ONLY
    go_wrapper: ManeuverDetectorModel
    stub_implementation: true

  # Collision Risk
  # WARNING: ONNX file does not exist - stub implementation only
  # Go wrapper returns: fmt.Errorf("onnx runtime inference not yet bound")
  - name: collision_risk
    version: "1.5.0"
    onnx_path: pkg/ml/onnx/collision_model.onnx
    opset: 16
    input_schema:
      - name: miss_distance
        shape: [1]
        dtype: float32
      - name: relative_velocity
        shape: [1, 3]
        dtype: float32
      - name: hardbody_radius
        shape: [1]
        dtype: float32
    output_schema:
      - name: collision_probability
        shape: [1]
        dtype: float32
      - name: time_to_closest_approach
        shape: [1]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Collision probability estimation with uncertainty quantification - STUB ONLY
    go_wrapper: CollisionRiskModel
    stub_implementation: true

  # Rapid Ranking
  # WARNING: ONNX file does not exist - stub implementation only
  # Go wrapper returns: fmt.Errorf("onnx runtime inference not yet bound")
  - name: rapid_ranker
    version: "3.0.0"
    onnx_path: pkg/ml/onnx/rapid_ranker.onnx
    opset: 17
    input_schema:
      - name: orbital_elements
        shape: [1, 6]
        dtype: float32
      - name: space_weather
        shape: [1, 3]
        dtype: float32
    output_schema:
      - name: threat_score
        shape: [1]
        dtype: float32
      - name: confidence
        shape: [1]
        dtype: float32
      - name: uncertainty_low
        shape: [1]
        dtype: float32
      - name: uncertainty_high
        shape: [1]
        dtype: float32
    quantization: fp32
    tier: 1
    description: Rapid threat ranking for catalog screening (100k+ objects) - STUB ONLY
    go_wrapper: RapidRankerModel
    stub_implementation: true

  # ICNN Energy Model
  # WARNING: ONNX file does not exist - model referenced but not trained/exported
  - name: icnn_hamiltonian
    version: "1.2.0"
    onnx_path: ai/v3/icnn_h_net.onnx
    opset: 17
    input_schema:
      - name: state
        shape: [1, 6]
        dtype: float32
      - name: latent_context
        shape: [1, 64]
        dtype: float32
    output_schema:
      - name: hamiltonian
        shape: [1]
        dtype: float32
      - name: gradient
        shape: [1, 6]
        dtype: float32
    quantization: fp32
    tier: 2
    description: Input Convex Neural Network for Hamiltonian energy (guarantees convexity) - MISSING ONNX
    go_wrapper: ICNNHamiltonianModel
    stub_implementation: true

  # Blindspot Forecaster
  # WARNING: ONNX file does not exist - stub implementation only
  # Go wrapper returns: fmt.Errorf("onnx blindspot inference not yet bound")
  - name: blindspot_forecaster
    version: "1.0.0"
    onnx_path: pkg/ml/onnx/blindspot_forecaster.onnx
    opset: 16
    input_schema:
      - name: occlusion_history
        shape: [1, 50, 6]
        dtype: float32
    output_schema:
      - name: predicted_trajectory
        shape: [1, 10, 6]
        dtype: float32
    quantization: fp16
    tier: 2
    description: Predicts object trajectory through sensor blindspots - STUB ONLY
    go_wrapper: BlindspotForecasterModel
    stub_implementation: true

# Global settings
settings:
  default_opset: 17
  default_quantization: fp32
  onnx_validation:
    check_model: true
    check_opset: true
    check_dtype: true
  go_package: ssis/pkg/ml/models
  code_gen_output: pkg/ml/models/generated
