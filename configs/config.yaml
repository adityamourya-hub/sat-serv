# SSIS Operational Parameter Store
# <plan_complexity>Low</plan_complexity><total_lines_estimate>40</total_lines_estimate>

# Engine Performance (M/D/c Tuning)
engine:
  batch_size: 32
  worker_count: 75
  provider: "CPU"         # [CPU, CUDA, ONEDNN]
  max_queue_depth: 5000  # Erlang-C Cliff Limit

# Physics & Failover
physics:
  d_kl_threshold: 4.5    # Nats (Entropy)
  propagation_step: 60.0 # Seconds
  sigma_position: 1.0    # km (Used for D_KL calculation)

# Sensing (ATeena-IQNet)
sensing:
  p_det_threshold: 0.90
  num_pulses: 128
  fs: 100000000.0        # 100 MHz

# Security
security:
  mtls_enabled: true
  jwt_expiration: "24h"
  audit_level: "VERBOSE"

# Proximity Analysis
proximity:
  # Screening parameters
  default_threat_radius_km: 500.0
  default_fov_half_angle_deg: 30.0
  temporal_tolerance_sec: 0.5

  # Reachability parameters
  cw_horizon_threshold_sec: 1800.0  # 30 minutes
  stm_horizon_max_sec: 7200.0       # 2 hours

  # Coverage parameters
  coverage_index_resolution_lat: 180
  coverage_index_resolution_lon: 360

  # Threat evaluation thresholds
  tight_proximity_km: 100.0
  critical_intercept_km: 20.0
